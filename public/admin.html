<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
<header class="admin-bar"><strong>Admin</strong>
  <nav aria-label="Submission type" class="admin-tabs" data-tabs>
    <button type="button" data-kind="" aria-pressed="true">All</button>
    <button type="button" data-kind="quote" aria-pressed="false">Solar quotes</button>
    <button type="button" data-kind="battery" aria-pressed="false">Battery quotes</button>
    <button type="button" data-kind="contact" aria-pressed="false">Contact</button>
    <button type="button" data-kind="installer" aria-pressed="false">Installers</button>
  </nav>
  <a class="btn btn-small" data-csv href="/api/admin/export.csv"><span>Export CSV</span></a>
</header>
<main class="admin-main">
  <p data-count class="admin-count" aria-live="polite">Loading…</p>
  <div class="table-wrap"><table class="admin-table"><thead><tr><th scope="col">Ref</th><th scope="col">Type</th><th scope="col">When</th><th scope="col">Who</th><th scope="col">Where</th><th scope="col">Detail</th><th scope="col">Sent to</th><th scope="col">Status</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead><tbody data-rows></tbody></table></div>
</main>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
